<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Osmipuzzle</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243447;background:#eaf2fb}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}.app{width:min(100%,430px);background:white;border-radius:24px;padding:24px;box-shadow:0 12px 35px #17243320;text-align:center}h1{margin:0 0 8px;font-size:clamp(25px,6vw,34px)}p{color:#566575}.stats{display:flex;justify-content:space-around;margin:16px 0}.stats strong{font-size:25px;display:block}.records{background:#eef5ff;border-radius:14px;padding:10px;margin-bottom:14px}.records .stats{margin:7px 0}.records strong{font-size:21px}#message{line-height:1.5}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;background:#243447;padding:10px;border-radius:18px;aspect-ratio:1}.tile{min-width:0;border:0;border-radius:12px;background:#f5eee0;color:#243447;font-size:clamp(30px,10vw,54px);font-weight:800;cursor:pointer;touch-action:manipulation}.tile.moveable{background:#f7cb71}.tile.empty{background:#172433;cursor:default}.tile:focus-visible{outline:4px solid #3a9aff;outline-offset:-4px}.tile:active:not(.empty){transform:scale(.96)}button.new{margin-top:18px;width:100%;padding:15px;background:#2968d9;border:0;color:white;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}#message{min-height:26px;font-weight:700;color:#287e66}small{color:#748092}@media(max-width:370px){.app{padding:14px}.board{gap:6px;padding:7px}}
</style></head><body><main class="app"><h1>🧩 Osmipuzzle</h1><p>Poskládej čísla od 1 do 8. Klikni na číslo vedle volného místa.</p><div class="stats"><div>Tahy<strong id="moves">0</strong></div><div>Čas<strong id="time">00:00</strong></div><div>Výhry<strong id="wins">0</strong></div></div><section class="records"><b>🏆 Moje rekordy</b><div class="stats"><div>Nejméně tahů<strong id="best-moves">—</strong></div><div>Nejlepší čas<strong id="best-time">—</strong></div></div></section><div class="board" id="board" aria-label="Hlavolam 3 krát 3"></div><p id="message" role="status"></p><button class="new" id="new">🔀 Zamíchat – nová hra</button><p><small>Verze 1.1</small></p></main>
<script>
(()=>{'use strict';
const goal=[1,2,3,4,5,6,7,8,0],$=id=>document.getElementById(id);
const adjacent=(a,b)=>Math.abs(Math.floor(a/3)-Math.floor(b/3))+Math.abs(a%3-b%3)===1;
const solved=()=>board.every((n,i)=>n===goal[i]);
const readNumber=key=>{const v=localStorage.getItem(key);return v===null?null:Number(v)};
const format=ms=>{const seconds=Math.floor(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')};
let board=goal.slice(),moves=0,wins=Number(localStorage.getItem('osmipuzzle-wins')||0);
let bestMoves=readNumber('osmipuzzle-best-moves'),bestTime=readNumber('osmipuzzle-best-time');
let startedAt=null,elapsed=0,finished=false,clock=null,winMessage='';
function stopClock(){if(clock!==null){clearInterval(clock);clock=null}}
function updateClock(){if(startedAt!==null&&!finished)elapsed=performance.now()-startedAt;$('time').textContent=format(elapsed)}
function render(){
 const root=$('board');root.replaceChildren();
 board.forEach((n,i)=>{const b=document.createElement('button');
 b.className='tile'+(!n?' empty':adjacent(i,board.indexOf(0))?' moveable':'');
 b.textContent=n||'';b.type='button';b.setAttribute('aria-label',n?'Číslo '+n:'Prázdné místo');
 b.disabled=!n||finished||!adjacent(i,board.indexOf(0));
 b.addEventListener('click',()=>move(i));root.append(b)});
 $('moves').textContent=moves;$('wins').textContent=wins;
 $('best-moves').textContent=bestMoves===null?'—':bestMoves;
 $('best-time').textContent=bestTime===null?'—':format(bestTime);
 $('message').textContent=winMessage;updateClock();
}
function move(i){
 const z=board.indexOf(0);if(!adjacent(i,z)||finished)return;
 if(startedAt===null){startedAt=performance.now();clock=setInterval(updateClock,200)}
 [board[i],board[z]]=[board[z],board[i]];moves++;
 if(solved()){
  elapsed=performance.now()-startedAt;finished=true;stopClock();wins++;
  localStorage.setItem('osmipuzzle-wins',String(wins));
  const newMoves=bestMoves===null||moves<bestMoves,newTime=bestTime===null||elapsed<bestTime;
  if(newMoves){bestMoves=moves;localStorage.setItem('osmipuzzle-best-moves',String(bestMoves))}
  if(newTime){bestTime=elapsed;localStorage.setItem('osmipuzzle-best-time',String(bestTime))}
  winMessage='🎉 Hotovo! '+moves+' tahů za '+format(elapsed)+'.'+(newMoves||newTime?' 🏆 Nový rekord'+(newMoves&&newTime?' v tazích i čase!':newMoves?' v počtu tahů!':' v čase!'):'');
 }
 render();
}
function shuffle(){
 stopClock();startedAt=null;elapsed=0;finished=false;winMessage='';board=goal.slice();
 let last=-1;for(let k=0;k<100;k++){const z=board.indexOf(0);
 const options=board.map((_,i)=>i).filter(i=>adjacent(z,i)&&i!==last);
 const i=options[Math.floor(Math.random()*options.length)];
 [board[i],board[z]]=[board[z],board[i]];last=z}
 moves=0;render();
}
$('new').addEventListener('click',shuffle);shuffle();
})();
</script></body></html>
