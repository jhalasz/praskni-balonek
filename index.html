<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎈 Praskni balónky</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#dcf5ff;color:#17436a;text-align:center}.wrap{max-width:850px;margin:auto;padding:12px}h1{margin:8px 0}.stats{display:flex;justify-content:space-around;font-size:clamp(18px,4vw,26px);font-weight:800;margin:10px auto}#field{height:min(67vh,570px);min-height:350px;position:relative;overflow:hidden;border:5px solid white;border-radius:24px;background:linear-gradient(#8fdcff,#dcf9ff 75%,#a7e795 76%);touch-action:manipulation}.cloud{position:absolute;background:white;border-radius:50px;opacity:.8;width:115px;height:35px;top:14%;left:9%;pointer-events:none}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%;width:45px;height:45px;top:-23px;left:20px}.cloud:after{left:55px;top:-35px;width:60px;height:60px}.cloud.two{left:70%;top:29%;transform:scale(.8)}.balloon{position:absolute;width:76px;height:95px;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;user-select:none}.body{position:absolute;inset:0 4px 14px;border-radius:52% 52% 48% 48%;background:var(--c);box-shadow:inset -12px -9px 0 #00000012,inset 10px 10px 0 #ffffff57;display:grid;place-items:center}.body:after{content:"";position:absolute;bottom:-6px;left:calc(50% - 6px);border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid var(--c)}.face{font-size:31px;color:#283446;transform:translateY(5px);font-weight:900}.string{position:absolute;top:89px;left:50%;height:20px;border-left:2px solid #777}.pop{position:absolute;font-size:36px;font-weight:900;pointer-events:none;animation:pop .45s ease-out forwards}@keyframes pop{to{transform:translateY(-45px) scale(1.6);opacity:0}}.panel{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffffdc;gap:15px;padding:20px}.panel[hidden]{display:none}.panel h2{font-size:clamp(25px,5vw,38px);margin:0}.panel p{font-size:20px;margin:0}.start{background:#ffbf36;border:0;border-radius:100px;padding:15px 32px;font-size:23px;font-weight:900;cursor:pointer;box-shadow:0 5px #d48b00}footer{padding:8px;font-size:15px}@media(max-width:500px){.balloon{width:65px;height:83px}.string{top:78px}}
</style></head><body><main class="wrap"><h1>🎈 Praskni balónky! 🎈</h1><div class="stats"><span>⭐ Body: <span id="score">0</span></span><span>⏱️ Čas: <span id="time">30</span> s</span></div><div id="field"><div class="cloud"></div><div class="cloud two"></div><div class="panel" id="panel"><h2>Veselé balónky čekají! 😄</h2><p>Praskej je kliknutím nebo dotykem.<br>Za každý dostaneš 1 bod.</p><button class="start" id="start">▶️ Hrát!</button></div></div><footer>Hraješ 30 sekund. Chyť co nejvíc balónků!</footer></main>
<script>
const field=document.querySelector('#field'),panel=document.querySelector('#panel'),scoreLabel=document.querySelector('#score'),timeLabel=document.querySelector('#time');
const colors=['#fb647e','#ffcb45','#8a78ed','#5ad0a7','#59b2ff','#ff94d4'];
let score=0,remaining=30,active=false,balloons=[],last=0,spawnClock=0,frame=0,timer=null;
function makeBalloon(){if(!active||balloons.length>=11)return;const b=document.createElement('button');b.className='balloon';b.setAttribute('aria-label','Prasknout balónek');b.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);b.innerHTML='<span class="body"><span class="face">•ᴗ•</span></span><span class="string"></span>';field.append(b);const w=b.offsetWidth;const balloon={el:b,x:Math.random()*Math.max(1,field.clientWidth-w),y:field.clientHeight+30,speed:55+Math.random()*30};balloons.push(balloon);b.style.left=balloon.x+'px';b.style.top=balloon.y+'px';b.addEventListener('pointerdown',e=>{e.preventDefault();if(!active)return;score++;scoreLabel.textContent=score;const po=document.createElement('span');po.className='pop';po.textContent='✨ +1';po.style.left=(balloon.x+10)+'px';po.style.top=balloon.y+'px';field.append(po);setTimeout(()=>po.remove(),480);remove(balloon)})}
function remove(b){b.el.remove();balloons=balloons.filter(v=>v!==b)}
function move(t){if(!active)return;let dt=Math.min((t-last)/1000,.05);last=t;spawnClock+=dt;while(spawnClock>.65){spawnClock-=.65;makeBalloon()}for(const b of [...balloons]){b.y-=b.speed*dt;b.el.style.top=b.y+'px';if(b.y< -120)remove(b)}frame=requestAnimationFrame(move)}
function end(){active=false;clearInterval(timer);cancelAnimationFrame(frame);balloons.forEach(b=>b.el.remove());balloons=[];panel.hidden=false;panel.innerHTML='<h2>🎉 Konec hry!</h2><p>Získal(a) jsi <strong>'+score+'</strong> bodů! 🏆</p><button class="start" id="start">🔄 Hrát znovu</button>';panel.querySelector('button').onclick=start}
function start(){active=false;cancelAnimationFrame(frame);clearInterval(timer);balloons.forEach(b=>b.el.remove());balloons=[];score=0;remaining=30;spawnClock=.4;scoreLabel.textContent='0';timeLabel.textContent='30';panel.hidden=true;active=true;last=performance.now();makeBalloon();frame=requestAnimationFrame(move);timer=setInterval(()=>{remaining--;timeLabel.textContent=remaining;if(remaining<=0)end()},1000)}
document.querySelector('#start').onclick=start;
</script></body></html>
