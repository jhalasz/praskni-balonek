<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praskni balónky – nový začátek</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f7ff;color:#20304b;text-align:center}
    main{max-width:520px}
    .emoji{font-size:clamp(56px,12vw,100px)}
    h1{font-size:clamp(28px,6vw,44px);margin:12px 0}
    p{font-size:clamp(17px,4vw,21px);line-height:1.5}
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">🎈</div>
    <h1>Praskni balónky</h1>
    <p>Prostor je připravený. Novou hru společně vytvoříme od začátku!</p>
  </main>
</body>
</html>
