<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Práskací šílenství</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;overflow:hidden}#game{position:relative;min-height:100svh;overflow:hidden;touch-action:manipulation;background:linear-gradient(#8bd8ff,#e7fbff 72%,#a7e89b);transition:background .5s}#game.level1{background:linear-gradient(#ffc7e7,#fff0b7 70%,#b9f0bd)}#game.level2{background:linear-gradient(#b8b5ff,#e4d8ff 70%,#a7e7ef)}#game.level3{background:linear-gradient(#ffcc9d,#fff0b8 70%,#b8e6a2)}
h1{text-align:center;margin:10px 6px 2px;color:white;text-shadow:0 3px 5px #245;font-size:clamp(25px,6vw,44px)}#hint{text-align:center;font-weight:700;color:#16436b;margin:4px 8px 8px}.stats{position:relative;z-index:5;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{background:white;border:3px solid white;border-radius:16px;padding:6px 13px;font-weight:900;font-size:clamp(16px,3vw,21px);box-shadow:0 3px 0 #0002}.balloon{position:absolute;width:clamp(56px,10vw,86px);height:clamp(72px,13vw,108px);border-radius:50% 50% 47% 47%;border:2px solid #ffffffa8;box-shadow:inset -9px -8px 12px #0002,inset 7px 5px 12px #fff8,0 6px 10px #2453;z-index:3;user-select:none;touch-action:manipulation}.balloon:before{content:"";position:absolute;left:0;right:0;top:20%;height:17%;background:#ff8b00}.balloon:after{content:"";position:absolute;left:0;right:0;top:40%;height:17%;background:#ffe52e}.stripe1{position:absolute;left:0;right:0;top:0;height:20%;background:#f22;border-radius:50% 50% 0 0}.stripe4{position:absolute;left:0;right:0;top:60%;height:17%;background:#22c55e}.stripe5{position:absolute;left:0;right:0;top:77%;height:23%;background:#2388ff;border-radius:0 0 50% 50%}.knot{position:absolute;bottom:-8px;left:calc(50% - 5px);width:10px;height:11px;background:#2587ef;clip-path:polygon(0 0,100% 0,50% 100%)}.string{position:absolute;top:100%;left:50%;height:24px;border-left:1px solid #667;transform:rotate(5deg)}.pop{position:absolute;z-index:4;pointer-events:none;font-size:32px;animation:boom .45s ease-out forwards}@keyframes boom{to{transform:scale(2.4) rotate(25deg);opacity:0}}#overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#14345b55;padding:18px}.panel{max-width:440px;width:100%;background:white;border:5px solid white;border-radius:28px;padding:24px;text-align:center;box-shadow:0 12px 35px #1235}.panel h2{font-size:clamp(26px,6vw,38px);margin:0 0 8px;color:#ed3e62}.panel p{font-size:18px;font-weight:650}button{border:0;border-radius:16px;background:#ff477e;color:white;font-size:21px;font-weight:900;padding:13px 26px;cursor:pointer;box-shadow:0 4px 0 #b51f52}#version{position:absolute;bottom:7px;right:10px;z-index:6;color:#244b65;font-size:12px;font-weight:700}@media(max-width:500px){.stats{gap:5px}.pill{padding:6px 9px}.balloon{width:62px;height:80px}}
</style></head><body><main id="game"><h1>🎈 PRÁSKACÍ ŠÍLENSTVÍ 💥</h1><div id="hint">Práskni balónek = +2 body · Kliknutí vedle = −1 bod</div><div class="stats"><div class="pill">⭐ Body: <span id="score">0</span></div><div class="pill">⏱️ Čas: <span id="time">90</span> s</div><div class="pill">🚀 Rychlost: <span id="speed">1</span></div></div><div id="version">Verze 1.0</div><div id="overlay"><section class="panel"><h2>🎈 Připravit, pozor…</h2><p>Práskej pruhované balónky! Za zásah máš 2 body, za kliknutí vedle ztratíš 1 bod.</p><button id="start">START HRY</button></section></div></main>
<script>
(function(){
const game=document.getElementById('game'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),speedEl=document.getElementById('speed');
let score=0,time=90,active=false,balloons=[],last=0,spawn=0,level=0,audio=null,musicTimer=null;
const rand=(a,b)=>Math.random()*(b-a)+a;
function sound(freq,duration,type,volume){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.value=volume||.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.stop(audio.currentTime+duration)}catch(e){}}
function update(){scoreEl.textContent=score;timeEl.textContent=time;const next=Math.floor(Math.max(0,score)/10);speedEl.textContent=next+1;if(next!==level){level=next;game.className=level%3===0?'':'level'+(level%3);sound(760,.2,'sine',.05)}}
function removeBall(b){b.el.remove();balloons=balloons.filter(x=>x!==b)}
function pop(b){if(!active)return;score+=2;update();const r=b.el.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent='💥';p.style.left=(r.left+r.width/2-18)+'px';p.style.top=(r.top+r.height/2-18)+'px';game.append(p);setTimeout(()=>p.remove(),500);sound(230,.18,'sawtooth',.08);removeBall(b)}
function miss(){score--;update();sound(180,.12,'square',.035)}
function makeBalloon(){if(!active)return;const el=document.createElement('div');el.className='balloon';el.innerHTML='<i class="stripe1"></i><i class="stripe4"></i><i class="stripe5"></i><i class="knot"></i><i class="string"></i>';const w=game.clientWidth,h=game.clientHeight;const b={el:el,x:rand(12,Math.max(13,w-90)),y:rand(125,Math.max(130,h-110)),vx:rand(-1.5,1.5),vy:rand(-1.5,1.5),base:rand(.65,1.25)};if(Math.abs(b.vx)+Math.abs(b.vy)<.5)b.vx=1;el.setAttribute('role','button');el.setAttribute('aria-label','Pruhovaný balónek');el.style.left=b.x+'px';el.style.top=b.y+'px';el.addEventListener('pointerdown',function(e){e.stopPropagation();pop(b)});game.append(el);balloons.push(b)}
function finish(){active=false;clearInterval(musicTimer);balloons.forEach(b=>b.el.remove());balloons=[];overlay.style.display='grid';overlay.innerHTML='<section class="panel"><h2>🎉 KONEC HRY!</h2><p>Vaše skóre: <strong>'+score+'</strong> bodů</p><button id="again">HRÁT ZNOVU</button></section>';document.getElementById('again').onclick=start}
function start(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();overlay.style.display='none';score=0;time=90;level=0;update();active=true;last=performance.now();spawn=0;musicTimer=setInterval(function(){if(active){const notes=[392,494,587,494];sound(notes[Math.floor(Math.random()*notes.length)],.16,'triangle',.018)}},550);requestAnimationFrame(loop);const tick=setInterval(function(){if(!active){clearInterval(tick);return}time--;update();if(time<=0){clearInterval(tick);finish()}},1000)}
function loop(now){if(!active)return;const dt=Math.min(32,now-last)/16.67;last=now;spawn+=dt;if(spawn>1.25){makeBalloon();spawn=0}const w=game.clientWidth,h=game.clientHeight,boost=1+Math.floor(Math.max(0,score)/10)*.17;balloons.slice().forEach(function(b){b.x+=b.vx*b.base*boost*dt;b.y+=b.vy*b.base*boost*dt;if(b.x<2||b.x>w-78)b.vx*=-1;if(b.y<110||b.y>h-105)b.vy*=-1;b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'});requestAnimationFrame(loop)}
game.addEventListener('pointerdown',function(e){if(active&&!e.target.closest('.balloon')&&!e.target.closest('button'))miss()});document.getElementById('start').addEventListener('click',start);
})();
</script></body></html>
