<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dbeaff">
<title>Praskni balónky – Skupina 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:18px;background:linear-gradient(135deg,#dbeaff,#f4e8ff);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24334a;text-align:center}
main{width:min(100%,760px);margin:0 auto}
header{padding:10px}
h1{font-size:clamp(30px,6vw,44px);margin:8px 0}
.subtitle{margin:4px 0 16px;font-size:17px}
.version{font-size:13px;color:#667085}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.stat{background:#fff;border-radius:14px;padding:10px 22px;min-width:112px;box-shadow:0 4px 14px #25385a12}
.stat strong{display:block;font-size:25px}
.stat span{font-size:13px;color:#667085}
button{border:0;border-radius:999px;padding:13px 25px;background:#2468b4;color:white;font-weight:700;font-size:17px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}
#field{position:relative;overflow:hidden;height:min(54vh,440px);min-height:280px;background:linear-gradient(#bfe5ff,#e5f7ff);border:5px solid white;border-radius:24px;box-shadow:0 10px 30px #25385a20;touch-action:manipulation}
.balloon{position:absolute;width:clamp(48px,9vw,70px);height:clamp(62px,11vw,88px);border-radius:50% 50% 46% 46%;border:2px solid #ffffff99;box-shadow:inset -8px -8px 0 #00000012,0 4px 8px #0002;cursor:pointer;user-select:none;display:grid;place-items:center;font-size:0;animation:appear .18s ease-out}
.balloon:after{content:"";position:absolute;bottom:-10px;left:calc(50% - 5px);border-width:11px 5px 0;border-style:solid;border-color:inherit;border-left-color:transparent;border-right-color:transparent}
.balloon:before{content:"";position:absolute;top:15%;left:20%;width:12px;height:20px;border-radius:50%;background:#ffffff80;transform:rotate(25deg)}
@keyframes appear{from{transform:scale(.5)}to{transform:scale(1)}}
#message{min-height:30px;margin:12px;font-weight:600}
.back{display:inline-block;margin:18px;color:#265eac}
@media(max-width:480px){body{padding:10px}.stat{padding:8px 14px;min-width:90px}#field{min-height:300px}}
</style>
</head>
<body>
<main>
<header><div aria-hidden="true" style="font-size:52px">🎈</div><h1>Praskni balónky</h1><p class="subtitle">Skupina 2 – chyť co nejvíce balónků!</p><p class="version">Verze 1.0</p></header>
<section class="stats" aria-label="Výsledky hry">
<div class="stat"><strong id="score">0</strong><span body="">Body</span></div>
<div class="stat"><strong id="time">30</strong><span>Čas (s)</span></div>
</section>
<button id="start" type="button">Začít hru</button>
<div id="message" role="status" aria-live="polite">Stiskni „Začít hru“ a praskni balónky!</div>
<div id="field" aria-label="Herní plocha"></div>
<a class="back" href="../">← Zpět na přehled skupin</a>
</main>
<script>
(()=>{
const field=document.getElementById('field'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),message=document.getElementById('message'),start=document.getElementById('start');
const colors=['#ff5b75','#ffad32','#42b9ed','#9b72e8','#35c98b','#f06ac2'];
let score=0,time=30,running=false,timer=null,spawner=null;
function clearGame(){clearInterval(timer);clearInterval(spawner);field.replaceChildren();}
function makeBalloon(){
 if(!running)return;
 const b=document.createElement('button');b.type='button';b.className='balloon';b.setAttribute('aria-label','Praskni balónek');
 const color=colors[Math.floor(Math.random()*colors.length)];b.style.background=color;b.style.borderColor=color;
 const maxX=Math.max(0,field.clientWidth-b.offsetWidth-8),maxY=Math.max(0,field.clientHeight-b.offsetHeight-14);
 b.style.left=(Math.random()*maxX)+'px';b.style.top=(Math.random()*maxY)+'px';
 b.addEventListener('click',()=>{if(!running)return;score++;scoreEl.textContent=score;b.remove();});
 field.appendChild(b);
}
function endGame(){running=false;clearGame();message.textContent='Konec hry! Získal/a jsi '+score+' bodů. Zahraj si znovu!';start.textContent='Hrát znovu';}
function begin(){clearGame();score=0;time=30;running=true;scoreEl.textContent=score;timeEl.textContent=time;message.textContent='Do toho! Praskej balónky!';start.textContent='Začít znovu';makeBalloon();makeBalloon();spawner=setInterval(()=>{makeBalloon();if(time<15)makeBalloon();},850);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame();},1000);}
start.addEventListener('click',begin);
})();
</script>
</body>
</html>
