<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6">
<title>Praskni balónky – skupina 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:16px;background:linear-gradient(135deg,#fff0f6,#eaf6ff);color:#26334a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{width:min(100%,650px);margin:0 auto;background:#fff;padding:clamp(18px,4vw,32px);border-radius:24px;box-shadow:0 12px 40px #24456b18}
h1{font-size:clamp(28px,6vw,42px);margin:4px 0}h2{margin:0;color:#5d6b82;font-size:20px}
p{margin:10px 0 18px;font-size:17px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{background:#f0f5ff;border-radius:14px;padding:10px 18px;min-width:110px;font-weight:700}
.stat span{display:block;font-size:25px;color:#245eaa}
#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,16px);max-width:480px;margin:20px auto}
.balloon{position:relative;border:0;background:transparent;min-height:clamp(88px,19vw,135px);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;border-radius:18px}
.balloon:focus-visible{outline:3px solid #245eaa}
.bubble{position:relative;width:clamp(46px,11vw,68px);height:clamp(58px,13vw,82px);border-radius:50% 50% 46% 46%;background:var(--balloon);box-shadow:inset -8px -7px 0 #00000012,inset 7px 5px 0 #ffffff55;transition:transform .12s}
.bubble:before{content:"";position:absolute;bottom:-7px;left:calc(50% - 6px);border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--balloon)}
.bubble:after{content:"";position:absolute;top:100%;left:50%;height:22px;border-left:2px solid #9aa4b2;transform:rotate(4deg);transform-origin:top}
.balloon:active .bubble{transform:scale(.85)}
.balloon.popped{animation:pop .18s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
button.action{border:0;border-radius:14px;background:#2467b2;color:white;font:700 18px system-ui;padding:13px 28px;cursor:pointer;touch-action:manipulation}
button.action:focus-visible{outline:3px solid #172f51;outline-offset:3px}
#message{min-height:28px;font-weight:700;color:#245eaa}
.version{font-size:13px;color:#667085;margin-top:22px}a{color:#265eac}
@media(max-width:380px){body{padding:8px}main{padding:14px}.stat{min-width:88px;padding:8px 12px}}
@media(prefers-reduced-motion:reduce){.balloon.popped{animation:none;opacity:0}}
</style>
</head>
<body><main>
<div aria-hidden="true" style="font-size:42px">🎈 🎈 🎈</div>
<h1>Praskni balónky</h1><h2>Skupina 1</h2>
<p>Klikni nebo klepni na co nejvíce barevných balónků, než vyprší čas!</p>
<div class="stats"><div class="stat">Body<span id="score">0</span></div><div class="stat">Čas<span id="time">30</span></div></div>
<div id="board" aria-label="Balónky k prasknutí"></div>
<button class="action" id="start">Začít hru</button>
<p id="message" role="status" aria-live="polite">Připrav se! Máš 30 sekund.</p>
<div class="version">Verze 1.1</div>
<p><a href="../">Zpět na přehled skupin</a></p>
</main>
<script>
const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),message=document.querySelector('#message'),startBtn=document.querySelector('#start');
const colors=['#ff5572','#ffc247','#39bde8','#9b70ed','#52c98b','#ff8a42','#f06fc1','#55a7ff','#a4c94a'];
let score=0,time=30,playing=false,timer=null;
function makeBalloon(){
 const button=document.createElement('button');button.className='balloon';button.type='button';button.setAttribute('aria-label','Praskni barevný balónek');
 const bubble=document.createElement('span');bubble.className='bubble';bubble.style.setProperty('--balloon',colors[Math.floor(Math.random()*colors.length)]);
 button.appendChild(bubble);button.addEventListener('click',()=>pop(button));return button;
}
function draw(){board.innerHTML='';for(let i=0;i<9;i++)board.appendChild(makeBalloon())}
function pop(button){
 if(!playing||button.disabled)return;button.disabled=true;button.classList.add('popped');score++;scoreEl.textContent=score;message.textContent='Povedlo se! +1 bod 🎉';
 setTimeout(()=>{if(!playing)return;button.replaceWith(makeBalloon())},220);
}
function finish(){playing=false;clearInterval(timer);board.querySelectorAll('button').forEach(b=>b.disabled=true);message.textContent='Čas vypršel! Získal/a jsi '+score+' bodů. Skvělá práce!';startBtn.textContent='Hrát znovu'}
function begin(){clearInterval(timer);score=0;time=30;playing=true;scoreEl.textContent=score;timeEl.textContent=time;message.textContent='Do toho! Praskej balónky!';startBtn.textContent='Začít znovu';draw();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
startBtn.addEventListener('click',begin);draw();
</script>
</body></html>
