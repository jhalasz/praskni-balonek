<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fcf4ff"><title>Lenčina hra – Barevné kuličky</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#312044;background:#fcf4ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}.app{width:min(100%,550px);text-align:center}h1{margin:.25em 0;font-size:clamp(1.7rem,6vw,2.6rem)}p{margin:8px 0 15px}.stats{display:flex;gap:10px;justify-content:center;margin:15px 0}.stat{background:#fff;border-radius:16px;padding:9px 20px;box-shadow:0 2px 12px #5b327017;font-weight:700}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(4px,1.6vw,9px);width:100%;padding:clamp(8px,2vw,14px);background:#e4cdf4;border-radius:22px;box-shadow:0 10px 30px #60388526}.cell{aspect-ratio:1;border:0;border-radius:13px;background:#f7eeff;display:grid;place-items:center;padding:9%;touch-action:manipulation;cursor:pointer;box-shadow:inset 0 2px 5px #6141791e}.cell:focus-visible{outline:3px solid #522b8a;outline-offset:1px}.ball{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:inset -7px -9px 10px #0002,inset 5px 6px 8px #fff9,0 3px 5px #0002}.cell.selected{outline:4px solid #7342ac;background:#fff}.cell.hint{background:#fffbea;box-shadow:inset 0 0 0 3px #f7ce55}.cell.popping .ball{animation:pop .25s forwards}@keyframes pop{to{transform:scale(0);opacity:0}}button.action{margin:18px 6px;background:#763ec3;color:white;border:0;border-radius:15px;padding:13px 24px;font:700 1rem system-ui;cursor:pointer}.message{min-height:3em;font-weight:650;color:#5d3580}.version{font-size:.8rem;color:#776989}.rules{font-size:.95rem} 
</style></head><body><main class="app"><h1>🌈 Lenčiny kuličky</h1><p class="rules">Ťukni na kuličku a potom na <b>libovolné prázdné políčko</b>. Tři stejné vedle sebe nebo nad sebou prasknou! 🎉</p><div class="stats"><div class="stat">⭐ Body: <span id="score">0</span></div><div class="stat">🎯 Tahy: <span id="moves">0</span></div></div><div class="board" id="board" aria-label="Herní pole se 6 řádky a 6 sloupci"></div><div class="message" id="message" aria-live="polite">Vyber kuličku a přesuň ji na volné místo.</div><button class="action" id="restart">🔄 Nová hra</button><div class="version">Verze 1.1</div></main>
<script>
(()=>{
'use strict';
const N=6, COLORS=['#ff637e','#ffbc3c','#48b9fa','#6ed58b','#aa7bea'], names=['růžová','žlutá','modrá','zelená','fialová'];
const boardEl=document.getElementById('board'), msg=document.getElementById('message'),scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves');
let cells=[],selected=null,score=0,moves=0,locked=false;
const random=n=>Math.floor(Math.random()*n);
const neighbors=i=>[i%N>0?i-1:-1,i%N<N-1?i+1:-1,i>=N?i-N:-1,i<N*(N-1)?i+N:-1].filter(x=>x>=0);
function matches(){const found=new Set();for(let y=0;y<N;y++){for(let x=0;x<N;x++){const i=y*N+x,c=cells[i];if(c===null)continue;for(const step of [1,N]){if(step===1&&x>N-3||step===N&&y>N-3)continue; if(cells[i+step]===c&&cells[i+step*2]===c){let k=i;while(k<N*N&&cells[k]===c&&(step!==1||Math.floor(k/N)===y)){found.add(k);k+=step;}}}}}return [...found];}
function render(popping=[]){boardEl.replaceChildren();cells.forEach((c,i)=>{const b=document.createElement('button');b.className='cell'+(selected===i?' selected':'')+(selected!==null&&c===null?' hint':'')+(popping.includes(i)?' popping':'');b.setAttribute('aria-label',`Řádek ${Math.floor(i/N)+1}, sloupec ${i%N+1}: ${c===null?'prázdné':names[c]+' kulička'}`);if(c!==null){const ball=document.createElement('span');ball.className='ball';ball.style.background=COLORS[c];b.append(ball);}b.addEventListener('click',()=>play(i));boardEl.append(b);});scoreEl.textContent=score;movesEl.textContent=moves;}
function hasMove(){return cells.some(c=>c!==null)&&cells.some(c=>c===null);}
function play(i){if(locked)return;if(cells[i]!==null){selected=selected===i?null:i;msg.textContent=selected===null?'Vyber kuličku.':'Teď klepni na jakékoli prázdné políčko.';render();return;}if(selected===null){msg.textContent='Nejdřív vyber barevnou kuličku.';return;}cells[i]=cells[selected];cells[selected]=null;selected=null;moves++;const hit=matches();if(hit.length){locked=true;score+=hit.length*10;msg.textContent=`🎉 Prasklo ${hit.length} kuliček! +${hit.length*10} bodů`;render(hit);setTimeout(()=>{hit.forEach(j=>cells[j]=null);locked=false;render();if(!hasMove())msg.textContent='🏆 Hotovo! Zkus novou hru.';},260);}else{msg.textContent='Pěkný tah! Zkus spojit tři stejné.';render();if(!hasMove())msg.textContent='🏆 Hotovo! Zkus novou hru.';}}
function start(){score=0;moves=0;selected=null;locked=false;let tries=0;do{cells=Array.from({length:N*N},()=>Math.random()<.27?null:random(COLORS.length));tries++;}while(matches().length&&tries<1000);if(tries>=1000){cells=Array.from({length:N*N},(_,i)=>Math.random()<.27?null:(Math.floor(i/N)*2+i%N)%COLORS.length);}msg.textContent='Vyber kuličku a přesuň ji na volné místo.';render();}
document.getElementById('restart').addEventListener('click',start);start();
})();
</script></body></html>
